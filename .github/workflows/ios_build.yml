name: Build iOS App

on:
  push:
    branches:
      - ios
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App with Go Backend Framework
    runs-on: macos-14

    steps:
      - name: Checkout Frontend (tmax_ui)
        uses: actions/checkout@v4
        with:
          path: ui

      - name: Clone Backend Source (tmax_back)
        run: |
          git clone --depth 1 -b ios https://github.com/Fenglifang0114/ios_tmax_back.git backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install gomobile & Build iOS Framework
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ui/ios/Frameworks
          cd backend/Backend
          gomobile bind -target=ios -o ../../ui/ios/Frameworks/Tmaxbackend.xcframework ./tmaxbackend
          cd ../../ui/ios
          if ! grep -q "Tmaxbackend" Podfile 2>/dev/null; then
            echo "pod 'Tmaxbackend', :path => 'Frameworks'" >> Podfile
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Flutter Dependencies & CocoaPods
        run: |
          cd ui
          flutter pub get
          cd ios
          pod install

      - name: Build iOS Application (Unsigned)
        run: |
          cd ui
          flutter build ios --release --no-codesign

      - name: Archive iOS Build Artifact
        run: |
          cd ui/build/ios/iphoneos
          zip -r ../../../Runner.app.zip Runner.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Runner-Build
          path: ui/Runner.app.zip
